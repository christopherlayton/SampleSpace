name: SampleSpace
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SampleSpace:
    type: application
    platform: macOS
    sources:
      - SampleSpace
      # runner.R and checks.R, copied into the app as Resources/R/
      - path: R
        type: folder
        buildPhase: resources
      # Sectors and levels, copied into the app as Resources/Content/
      - path: Content
        type: folder
        buildPhase: resources
    info:
      path: SampleSpace/Info.plist
      properties:
        CFBundleDisplayName: Sample Space
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.samplespace.SampleSpace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # drawn by scripts/make_app_icon.swift
        PRODUCT_NAME: SampleSpace
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - SampleSpaceTests
  SampleSpaceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SampleSpaceTests
    dependencies:
      - target: SampleSpace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.samplespace.SampleSpaceTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
